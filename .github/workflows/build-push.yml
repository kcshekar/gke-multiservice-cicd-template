name: Build and push image

# Signs in with GitHub OIDC (Workload Identity Federation), so no key is stored in GitHub.
# The caller's job needs `permissions: { id-token: write, contents: read }`.
on:
  workflow_call:
    inputs:
      workload-identity-provider:
        type: string
        required: true
      service-account:
        type: string
        required: true
      registry-host:
        description: For example us-central1-docker.pkg.dev
        type: string
        required: true
      image:
        description: Full image name without a tag
        type: string
        required: true
      tag:
        type: string
        required: true
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.service-account }}
          token_format: access_token
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.registry-host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.image }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
