# cat <<EOF | kubectl apply -f -
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: common-ingress-staging
  namespace: your-app-namespace
  labels:
    app.kubernetes.io/part-of: your-app-namespace
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: "true"
    kubernetes.io/ingress.global-static-ip-name: your-static-ip-name #it should be global ip not regional ip
    cert-manager.io/issuer: letsencrypt-staging # Important: Use 'issuer.yaml->metadata->name'
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: gce
  tls:
    - hosts:
        - app.your-domain.com
        - api.your-domain.com
      secretName: your-app-tls-secret
  rules:
    - host: app.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: api.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bridge-service
                port:
                  number: 80

# EOF
