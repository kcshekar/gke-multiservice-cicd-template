# Copies one JSON secret from Secret Manager into the Secret `app-secrets`.
# Only this service account can read Secret Manager; app pods cannot.
# Replace the your-reader and your-project placeholders; overlays set the secret name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  annotations:
    iam.gke.io/gcp-service-account: your-reader@your-project.iam.gserviceaccount.com
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: your-project
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: external-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: your-app-config
