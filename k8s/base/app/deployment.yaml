apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  # No `replicas`: the HPA owns it, and a value here would reset it on every apply.
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      serviceAccountName: app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: app # the overlay's `images:` sets the real name and tag
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets # created by the external-secrets component
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
